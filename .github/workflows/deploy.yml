name: Deploy GeoLapor to Azure AKS

on:
  push:
    branches: ["main"]

env:
  RESOURCE_GROUP: geolapor-rg
  CLUSTER_NAME: geolapor-cluster
  BACKEND_IMAGE: geolapor-backend
  FRONTEND_IMAGE: geolapor-frontend

jobs:
  deploy:
    name: Build and Deploy to AKS
    runs-on: ubuntu-latest

    steps:
      # ==============================
      # 0. CHECKOUT
      # ==============================
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # ==============================
      # 1. AUTHENTICATION (Docker & Azure)
      # ==============================
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS Credentials
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ env.RESOURCE_GROUP }}
          cluster-name: ${{ env.CLUSTER_NAME }}

      # ==============================
      # 2. BUILD & PUSH BACKEND
      # ==============================
      - name: Build and Push Backend Image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
            ./geolapor-backend

          docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      # ==============================
      # 3. BUILD & PUSH FRONTEND
      # ==============================
      - name: Build and Push Frontend Image
        run: |
          docker build \
            --build-arg VITE_API_URL=${{ secrets.VITE_API_URL }} \
            --build-arg VITE_CDN_URL=${{ secrets.VITE_CDN_URL }} \
            -t ${{ secrets.DOCKER_USERNAME }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
            ./frontend

          docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

      # ==============================
      # 4. INJECT SECRETS, DATABASE & DEPLOY
      # ==============================
      - name: Create Kubernetes Secrets
        run: |
          kubectl delete secret geolapor-secrets --ignore-not-found
          kubectl create secret generic geolapor-secrets \
            --from-literal=db-password=${{ secrets.DB_PASSWORD }} \
            --from-literal=jwt-secret=${{ secrets.JWT_SECRET }} \
            --from-literal=azure-conn-string="${{ secrets.AZURE_STORAGE_CONNECTION }}"

      - name: Inject PostGIS Database (ConfigMap)
        run: |
          kubectl create configmap db-init-script \
            --from-file=init.sql=database_geolapor.sql \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to AKS
        uses: azure/k8s-deploy@v5
        with:
          manifests: |
            k8s/geolapor-backend.yaml
            k8s/geolapor-frontend.yaml
            k8s/geolapor-ingress.yaml
          images: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}