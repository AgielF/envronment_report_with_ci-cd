apiVersion: apps/v1
kind: Deployment
metadata:
  name: geolapor-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: geolapor-frontend
  template:
    metadata:
      labels:
        app: geolapor-frontend
    spec:
      containers:
      - name: frontend
        image: DOCKER_IMAGE_PLACEHOLDER
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: geolapor-frontend-svc
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: geolapor-frontend