apiVersion: apps/v1
kind: Deployment
metadata:
  name: geolapor-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: geolapor-frontend
  template:
    metadata:
      labels:
        app: geolapor-frontend
    spec:
      containers:
      - name: frontend
        image: agielf/geolapor-frontend
        # =============== PENAMBAHAN UNTUK HPA ===============
        resources:
          requests:
            cpu: "50m"
          limits:
            cpu: "150m"
        # ====================================================
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: geolapor-frontend-svc
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: geolapor-frontend